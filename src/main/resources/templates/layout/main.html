<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #2c3e50; color: white; }
        .sidebar a { color: rgba(255,255,255,0.8); text-decoration: none; padding: 15px; display: block; }
        .sidebar a:hover, .sidebar a.active { background: #34495e; color: white; border-left: 4px solid #3498db; }
        .brand-logo { font-size: 1.5rem; font-weight: bold; padding: 20px; text-align: center; background: #1a252f; }
        .card-stat { border-radius: 15px; border: none; transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">
            <div class="brand-logo">
                <i class="fa-solid fa-location-dot text-info"></i> Aurora
            </div>
            <div class="d-flex flex-column">
                
                <!-- CORRECCIÓN: Usamos #httpServletRequest con navegación segura -->
                
                <a th:href="@{/}" 
                   th:classappend="${#httpServletRequest?.requestURI == '/' ? 'active' : ''}">
                    <i class="fa-solid fa-chart-line me-2"></i> Dashboard
                </a>
                
                <a th:href="@{/users}" 
                   th:classappend="${#httpServletRequest?.requestURI == '/users' ? 'active' : ''}">
                    <i class="fa-solid fa-users me-2"></i> Usuarios
                </a>
                
                <a th:href="@{/devices}" 
                   th:classappend="${#httpServletRequest?.requestURI == '/devices' ? 'active' : ''}">
                    <i class="fa-solid fa-mobile-screen me-2"></i> Dispositivos
                </a>
                
                <a href="#" class="mt-auto text-danger">
                    <i class="fa-solid fa-right-from-bracket me-2"></i> Salir
                </a>
            </div>
        </div>

        <!-- Content -->
        <div class="col-md-10 p-4">
            <div layout:fragment="content">
                <!-- Aquí se inyectará el contenido de cada página -->
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
