<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Dispositivos - Aurora</title>
</head>
<body>

<div layout:fragment="content">
    <h2 class="mb-4">Inventario de Dispositivos</h2>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Dispositivo</th>
                        <th>Propietario</th>
                        <th>ID Hardware</th>
                        <th>Estado</th>
                        <th>Última Conexión</th>
                        <th>Mapa</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="device : ${devices}">
                        <td th:text="${device.id}">#</td>
                        <td>
                            <span class="fw-bold" th:text="${device.name}">Nombre</span>
                        </td>
                        <td>
                            <span th:text="${device.user.email}" class="text-muted">user@mail.com</span>
                        </td>
                        <td>
                            <code class="small" th:text="${#strings.abbreviate(device.deviceIdentifier, 15)}">ID...</code>
                        </td>
                        <td>
                            <span th:if="${device.isLost}" class="badge bg-danger">PERDIDO</span>
                            <span th:unless="${device.isLost}" class="badge bg-success">Seguro</span>
                        </td>
                        <td th:text="${#temporals.format(device.lastSeen, 'dd-MM-yyyy HH:mm')}">Fecha</td>
                        <td>
                            <a href="#" class="btn btn-sm btn-outline-info" title="Ver en Mapa">
                                <i class="fa-solid fa-map-location-dot"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(devices)}">
                        <td colspan="7" class="text-center py-4 text-muted">No hay dispositivos registrados</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
