<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Usuarios - Aurora</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Usuarios</h2>
        <!-- Botón de ejemplo (no funcional en esta demo) -->
        <button class="btn btn-primary disabled"><i class="fa-solid fa-plus"></i> Nuevo</button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">#</td>
                        <td>
                            <div class="d-flex align-items-center">
                                <div class="rounded-circle bg-secondary text-white d-flex justify-content-center align-items-center me-2" 
                                     style="width: 32px; height: 32px;">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                                <div>
                                    <div class="fw-bold" th:text="${user.nombre}">Nombre</div>
                                    <div class="small text-muted" th:if="${user.isStaff}">Admin</div>
                                </div>
                            </div>
                        </td>
                        <td th:text="${user.email}">email@test.com</td>
                        <td th:text="${user.numero}">+51...</td>
                        <td>
                            <span th:if="${user.isActive}" class="badge bg-success">Activo</span>
                            <span th:unless="${user.isActive}" class="badge bg-secondary">Inactivo</span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" title="Ver Detalles"><i class="fa-solid fa-eye"></i></button>
                        </td>
                    </tr>
                    <!-- Mensaje si no hay usuarios -->
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="6" class="text-center py-4 text-muted">No hay usuarios registrados</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
