<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<body>

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Usuarios</h2>
        <button class="btn btn-primary"><i class="fa-solid fa-plus"></i> Nuevo</button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}">1</td>
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="rounded-circle bg-secondary text-white d-flex justify-content-center align-items-center me-2" 
                                 style="width: 32px; height: 32px;">
                                <i class="fa-solid fa-user"></i>
                            </div>
                            <span th:text="${user.nombre}">Nombre</span>
                        </div>
                    </td>
                    <td th:text="${user.email}">email@test.com</td>
                    <td th:text="${user.numero}">+51...</td>
                    <td>
                        <span th:if="${user.isActive}" class="badge bg-success">Activo</span>
                        <span th:unless="${user.isActive}" class="badge bg-secondary">Inactivo</span>
                        <span th:if="${user.isStaff}" class="badge bg-info text-dark">Staff</span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-eye"></i></button>
                        <button class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-ban"></i></button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
