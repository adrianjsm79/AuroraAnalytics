<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Aurora Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #ecf0f1; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; border-radius: 15px; border: none; }
        .login-header { background: #2c3e50; color: white; border-radius: 15px 15px 0 0; padding: 20px; text-align: center; }
    </style>
</head>
<body>

<div class="card login-card shadow-lg">
    <div class="login-header">
        <h3>Aurora Admin</h3>
        <p class="mb-0 small text-white-50">Acceso restringido</p>
    </div>
    <div class="card-body p-4">
        <form method="post" action="/login">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="admin" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
    </div>
</div>

</body>
</html>
