# ==============================================================
# 🌍 CONFIGURACIÓN DEL SERVIDOR
# ==============================================================
server.port=${PORT:8080}
spring.application.name=aurora-admin

# ==============================================================
# 🗄️ BASE DE DATOS (PostgreSQL - Corrección JDBC)
# ==============================================================

# EN LUGAR DE USAR 'DATABASE_URL' DIRECTAMENTE, CONSTRUIMOS LA URL JDBC:
# 1. Añadimos el prefijo 'jdbc:'
# 2. Usamos las variables granulares que Railway provee (PGHOST, PGPORT, PGDATABASE)
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}

# 3. Pasamos usuario y contraseña por separado
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# Driver oficial
spring.datasource.driver-class-name=org.postgresql.Driver

# INTEGRIDAD CON DJANGO (No tocar tablas)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================
# 🚀 REDIS
# ==============================================================
spring.data.redis.url=${REDIS_URL}
spring.data.redis.timeout=2000

# ==============================================================
# ⚙️ VARIOS
# ==============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8