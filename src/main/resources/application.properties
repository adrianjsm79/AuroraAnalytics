# ==============================================================
# 🌍 CONFIGURACIÓN DEL SERVIDOR (Railway)
# ==============================================================
# Railway asigna un puerto dinámico en la variable $PORT.
server.port=${PORT:8080}
spring.application.name=aurora-admin

# ==============================================================
# 🗄️ BASE DE DATOS (JPA / Hibernate)
# ==============================================================
# NOTA: La conexión (URL, User, Pass) se maneja en 'DataSourceConfig.java'.
# Aquí solo configuramos el comportamiento de Hibernate.

# Validar que el esquema coincida con las entidades, pero NO modificarlo (Django es el dueño).
spring.jpa.hibernate.ddl-auto=validate

# Dialecto para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mostrar SQL en consola (útil para debug, puedes ponerlo en false en producción)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactivar Open-in-View para evitar conexiones largas a la BD
spring.jpa.open-in-view=false

# ==============================================================
# 🚀 REDIS (Tiempo Real)
# ==============================================================
# Railway inyecta la URL completa en REDIS_URL.
spring.data.redis.url=${REDIS_URL}
spring.data.redis.timeout=2000

# ==============================================================
# 🎨 VISTAS (Thymeleaf)
# ==============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ==============================================================
# 🔒 SEGURIDAD (Spring Security)
# ==============================================================
# Usuario temporal para el dashboard (hasta que conectes la tabla de usuarios)
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# ==============================================================
# ⚙️ OTROS
# ==============================================================
spring.main.banner-mode=off
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

logging.level.org.thymeleaf=DEBUG